# File: pyproject.toml
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobookbay_automated"
version = "1.0.0"
description = "Search AudiobookBay and send books to your Download Client"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "meek2100", email = "meek2100@users.noreply.github.com" },
    { name = "jamesry96", email = "jamesry96@users.noreply.github.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "Flask==3.1.3",
    "Flask-Executor==1.0.0",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "qbittorrent-api==2026.10.1",
    "transmission-rpc==7.0.12",
    "deluge-web-client==2.1.1",
    "cachetools==7.2.7",
    "gunicorn==26.2.0",
    "Flask-WTF==1.3.0",
    "Flask-Limiter==4.1.1",
    "Flask-Talisman==1.1.0",
]
[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-flask==1.3.0",
    "pytest-env==1.8.3",
    "pytest-cov==7.1.0",
    "requests-mock==1.12.1",
    "ruff==0.17.3",
    "pre-commit==4.7.0",
    "mypy==2.4.1",
    "pyright==1.1.414",
    "types-requests==2.33.0.20261030",
    "types-cachetools==7.0.0.20260713",
    "types-gunicorn==26.2.0.20261008",
]

[project.urls]
"Homepage" = "https://github.com/meek2100/audiobookbay-automated"

[tool.setuptools.packages.find]
where = ["."]
include = ["audiobook_automated*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=audiobook_automated --cov-report=term-missing --cov-fail-under=100"
env = [
    "TESTING=1",
    "SAVE_PATH_BASE=/tmp/test_downloads",
    "SECRET_KEY=test-secret-key",
    "DL_CLIENT=qbittorrent",
    "DL_HOST=localhost",
    "DL_PORT=8080",
    "DL_USERNAME=admin",
    "DL_PASSWORD=admin",
]
filterwarnings = ["ignore::DeprecationWarning:bs4.*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "S", "UP", "PL"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to use asserts, magic values, hardcoded passwords, and weak crypto
"tests/**/*" = [
    "S",
    "PLR2004",
    "PLR0913",
    "PLR0917",
    "PLC0415",
    "S101",
    "S104",
    "S105",
    "S106",
    "S108",
    "PLR1714",
]
# Network uses globals for singleton/semaphore management
"audiobook_automated/scraper/network.py" = ["PLW0603"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
ignore_missing_imports = true
strict = true
mypy_path = "stubs"

[[tool.mypy.overrides]]
module = [
    "flask_wtf.csrf",
    "transmission_rpc",
    "bs4.*",
    "urllib3.*",
    "requests_mock.*",
    "pytest.*",
    "flask_talisman.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pyright]
pythonVersion = "3.14"
include = ["audiobook_automated", "tests"]
typeCheckingMode = "strict"
# Reduce noise from untyped libraries (handled by mypy overrides mostly)
reportMissingImports = "none"
reportMissingTypeStubs = "none"
reportUntypedFunctionDecorator = "none"
# Allow untyped variables from libraries (essential for Flask/Requests/BS4)
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
# Missing sources are inevitable for some libraries (like bs4 stubs issues)
reportMissingModuleSource = "none"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]
