# File: .github/workflows/release.yaml
name: Create Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already committed in pyproject.toml, for example 1.0.0"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Validate release version and branch
        env:
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          uv run --no-project python - <<'PY'
          import datetime
          import os
          import re
          import tomllib
          from pathlib import Path
          version = os.environ["VERSION"]
          if not re.fullmatch(r"(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)", version):
              raise SystemExit("Use a version such as 1.0.0, without a leading v.")
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if project["version"] != version:
              raise SystemExit("Commit the matching pyproject.toml version before releasing.")
          section = re.search(
              rf"^## \[{re.escape(version)}\] - (\d{{4}}-\d{{2}}-\d{{2}})\s*$",
              Path("CHANGELOG.md").read_text(),
              re.MULTILINE,
          )
          if section is None:
              raise SystemExit("Add a dated changelog section for this version before releasing.")
          try:
              datetime.date.fromisoformat(section[1])
          except ValueError:
              raise SystemExit("Use a valid YYYY-MM-DD date in the release changelog heading.") from None
          PY
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::This version tag already exists."
            exit 1
          fi
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yaml
  image:
    needs: checks
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yaml
    with:
      version: ${{ inputs.version }}
  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the tag and release for the checked commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "Release v$VERSION" --generate-notes
