services:
  audiobookbay-automated:
    image: ghcr.io/meek2100/audiobookbay-automated:latest
    restart: unless-stopped
    ports:
      - "5078:5078"
    env_file:
      # Create .env next to your copy of compose.yaml before starting.
      # Optional here allows the example to be checked without your private settings.
      - path: .env
        required: false
